# ============================================================
# Nginx reverse-proxy config for fb-monitor (FastAPI / uvicorn)
# ============================================================
# Place this file at: /etc/nginx/sites-available/fb-monitor
# Then: sudo ln -s /etc/nginx/sites-available/fb-monitor \
#              /etc/nginx/sites-enabled/fb-monitor
#       sudo nginx -t && sudo systemctl reload nginx
# ============================================================

# Rate-limit zone (optional — protects the API)
limit_req_zone $binary_remote_addr zone=api:10m rate=30r/m;

# ---- HTTP (port 80) ----
server {
    listen 80;
    server_name _;          # Replace _ with your domain, e.g. monitor.example.com

    # --- Uncomment the two lines below after running certbot ---
    # return 301 https://$host$request_uri;

    # ---- Gzip ----
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript;
    gzip_min_length 1024;
    gzip_vary on;

    # ---- Proxy to uvicorn ----
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;

        # WebSocket support
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_read_timeout  120s;
        proxy_send_timeout  120s;

        # Rate-limit API endpoints
        limit_req zone=api burst=10 nodelay;
    }

    # Static files served directly by Nginx (optional — faster than Python)
    location /static/ {
        alias /opt/fb-monitor/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

